    <script>
      // Aplica el tema guardado antes de que cargue el bundle, para evitar el parpadeo.
      // Debe coincidir con `src/stores/theme.store.ts` (clave `theme`, valores light|dark|system).
      try {
        var mode = localStorage.getItem('theme') || 'system'
        var dark =
          mode === 'dark' ||
          (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
