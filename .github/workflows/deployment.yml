name: Deployment

on:
  # Publica al fusionar un PR a `main` (un merge es un push a `main`). `main` está protegida:
  # solo se escribe en ella con un PR, así que ningún commit suelto ni ninguna otra rama publica.
  push:
    branches: [main]
  # Despliegue manual de la rama que elijas en Actions → Deployment → Run workflow. Ojo: hay un
  # solo sitio publicado, así que desplegar otra rama sustituye la versión real.
  workflow_dispatch:

# Dos despliegues a la vez se pisarían al empujar a gh-pages: se encolan en vez de solaparse.
concurrency:
  group: deployment
  cancel-in-progress: false

# El deploy empuja a la rama gh-pages con GITHUB_TOKEN. Esa rama no dispara este workflow
# (solo `main`), así que no hay bucle.
permissions:
  contents: write

# Si faltan las variables obligatorias, `vite build` aborta con la lista (ver vite.config.ts):
# nunca se publica un formulario de contacto roto. VITE_APP_GOOGLE_ANALITYCS y VITE_APP_APPURL son opcionales.
env:
  VITE_APP_APPURL: ${{ vars.VITE_APP_APPURL }}
  VITE_APP_FILENAME_CV: ${{ vars.VITE_APP_FILENAME_CV }}
  VITE_APP_GOOGLE_ANALITYCS: ${{ secrets.VITE_APP_GOOGLE_ANALITYCS }}
  VITE_APP_EMAILJS_BASE_URL: ${{ vars.VITE_APP_EMAILJS_BASE_URL }}
  VITE_APP_EMAILJS_SERVICE_ID: ${{ secrets.VITE_APP_EMAILJS_SERVICE_ID }}
  VITE_APP_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_APP_EMAILJS_TEMPLATE_ID }}
  VITE_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_APP_EMAILJS_PUBLIC_KEY }}
  VITE_APP_TO_NAME: ${{ vars.VITE_APP_TO_NAME }}
  VITE_APP_TO_EMAIL: ${{ vars.VITE_APP_TO_EMAIL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--ignore-scripts` evita `husky` (hook de pre-commit) en CI, donde no hace falta.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      # `npm run build` ya ejecuta vue-tsc, pero va aparte para que el fallo de tipos salga etiquetado.
      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
